name: Backend automated checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'server/**'
      - 'web/**'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'web/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r server/requirements.txt pytest
      - name: Run API checks
        run: cd server && python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate frontend JavaScript
        run: node --check web/app.js
