# Free IAmStrata CRM testing deployment. No paid service or worker is declared.
# Uses the existing free PostgreSQL resource; does not create another database.
services:
  - type: web
    name: iamstrata-crm-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: STRATA_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: iamstrata-crm-dev-db
          property: connectionString
      - key: STRATA_ADMIN_EMAIL
        value: ronsumay2019@gmail.com
      - key: STRATA_ADMIN_PASSWORD
        generateValue: true
      - key: STRATA_ENCRYPTION_KEY
        generateValue: true
      - key: STRATA_VOICE_BRIDGE_SECRET
        generateValue: true
      - key: STRATA_MESSAGING_APPROVED
        value: 'false'
